name: Release v1.0+

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Release (.exe / .msi / .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend format check
        run: pnpm format:check

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Frontend unit tests
        run: pnpm test

      - name: Frontend production build
        run: pnpm build

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: Build Tauri release bundles (MSI + NSIS)
        run: pnpm tauri build

      - name: Package installers, standalone exe, zip, and SHA256SUMS.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi -ErrorAction SilentlyContinue | Copy-Item -Destination release-assets/ -Force
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue | Copy-Item -Destination release-assets/ -Force
          Copy-Item -Path src-tauri/target/release/lumen.exe -Destination release-assets/lumen.exe -Force
          Compress-Archive -Path src-tauri/target/release/lumen.exe -DestinationPath release-assets/Lumen-portable-x64.zip -Force
          $files = Get-ChildItem -Path release-assets -File | Sort-Object Name
          if ($files.Count -eq 0) {
            throw "No release assets were generated."
          }
          $hashes = $files | ForEach-Object {
            $h = Get-FileHash -Path $_.FullName -Algorithm SHA256
            "$($h.Hash.ToLowerInvariant())  $($_.Name)"
          }
          Set-Content -Path release-assets/SHA256SUMS.txt -Value $hashes -Encoding utf8
          Get-ChildItem -Path release-assets -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $assetPaths = (Get-ChildItem -Path release-assets -File | Sort-Object Name).FullName
          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag @assetPaths --clobber
          } else {
            & gh release create $tag @assetPaths --title "Lumen $tag" --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "gh release command failed with exit code $LASTEXITCODE"
          }
