name: Release v1.0+

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Signed / Packaged Windows Installers
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates before packaging
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: Build Tauri release bundles (MSI + NSIS)
        run: pnpm tauri build

      - name: Package portable binary and generate SHA256SUMS.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-assets/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/ -ErrorAction SilentlyContinue
          Compress-Archive -Path src-tauri/target/release/lumen.exe -DestinationPath release-assets/Lumen-portable-x64.zip -Force
          Get-FileHash release-assets/* -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)"
          } | Out-File -FilePath release-assets/SHA256SUMS.txt -Encoding utf8

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.msi
            release-assets/*.exe
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
