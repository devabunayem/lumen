[package]
name = "lumen-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Calendar sync providers (Local, ICS, Google PKCE, Microsoft Graph delta) and Credential Manager token storage for Lumen"

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = "4.2.0"
windows = { version = "0.62", features = [
    "Foundation",
    "Web_Http",
    "Web_Http_Headers",
    "Storage_Streams",
] }
