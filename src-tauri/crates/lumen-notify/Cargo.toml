[package]
name = "lumen-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Privacy-first Windows notification pipeline and filters for Lumen"

[dependencies]
base64 = "0.23"
rusqlite = { version = "0.43", features = ["bundled"] }
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
