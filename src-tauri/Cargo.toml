[workspace]
members = [
    ".",
    "crates/lumen-core",
    "crates/lumen-windows",
    "crates/lumen-media",
    "crates/lumen-prayer",
    "crates/lumen-notify",
    "crates/lumen-storage",
    "crates/lumen-plugins",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Abu Nayem <mdnayem1100khan@gmail.com>"]
repository = "https://github.com/devabunayem/lumen"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.54", features = ["sync", "time", "rt-multi-thread"] }
lumen-core = { path = "crates/lumen-core" }
lumen-windows = { path = "crates/lumen-windows" }
lumen-media = { path = "crates/lumen-media" }
lumen-prayer = { path = "crates/lumen-prayer" }
lumen-notify = { path = "crates/lumen-notify" }
lumen-storage = { path = "crates/lumen-storage" }
lumen-plugins = { path = "crates/lumen-plugins" }

[package]
name = "lumen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Free and open-source Dynamic Island for Windows 10 and 11"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tokio.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
lumen-core.workspace = true
lumen-windows.workspace = true
lumen-media.workspace = true
lumen-prayer.workspace = true
lumen-notify.workspace = true
lumen-storage.workspace = true
lumen-plugins.workspace = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
